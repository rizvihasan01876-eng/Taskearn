<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account status — TaskEarn</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/global.css">
<style>
  .te-status-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .te-status-card { max-width: 460px; text-align: center; }
</style>
</head>
<body>
<div class="te-status-wrap">
  <div class="te-card te-status-card">
    <span class="te-badge te-badge--rejected" id="status-badge" style="margin-bottom:16px;">Account status</span>
    <h1 id="status-title">Account restricted</h1>
    <p id="status-message">Your account currently can't access TaskEarn.</p>
    <a href="/contact.html" class="te-btn te-btn--primary te-mt-24">Contact support</a>
    <div class="te-mt-24"><a href="#" id="logout-link">Log out</a></div>
  </div>
</div>
<script type="module">
  import { getQueryParam, escapeHTML } from "/js/utils.js";
  import { logoutUser } from "/js/auth.js";
  import { initTheme } from "/js/theme.js";
  initTheme();

  const status = getQueryParam("status") || "suspended";
  const copy = {
    suspended: { title: "Account temporarily suspended", message: "Your account has been suspended pending review. If you believe this is a mistake, please contact support with your account email." },
    banned: { title: "Account banned", message: "This account has been banned for violating TaskEarn's terms of service. Contact support if you have questions." }
  };
  const c = copy[status] || copy.suspended;
  document.getElementById("status-title").textContent = c.title;
  document.getElementById("status-message").textContent = c.message;
  document.getElementById("status-badge").textContent = status === "banned" ? "Banned" : "Suspended";

  document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); logoutUser(); });
</script>
</body>
</html>
